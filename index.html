<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal portfolio and academic website">
  <title>Mohit Kumar Pandey — Portfolio & Academics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --sidebar-width: 280px; --brand-color: #0d6efd; }
    body { background: #f8f9fa; }
    .app-sidebar { width: var(--sidebar-width); }
    .sidebar-link { color: #6c757d; }
    .sidebar-link:hover, .sidebar-link.active { color: var(--brand-color); background: color-mix(in srgb, var(--brand-color) 10%, white); }
    .category-toggle { color: #212529; }
    .category-toggle:not(.collapsed) .bi-chevron-right { transform: rotate(90deg); }
    .bi-chevron-right { transition: transform .2s ease; }
    .brand-color { color: var(--brand-color) !important; }
    .visitor-footer { font-size: .68rem; color: #8a93a3; }
    .visitor-footer .country-flag { font-size: .85rem; margin-right: .2rem; }
    .content-column { min-width: 0; }
    .content-card { max-width: 900px; }
    @media (min-width: 992px) {
      .app-sidebar { position: fixed; inset: 0 auto 0 0; }
      .content-column { margin-left: var(--sidebar-width); }
    }
  </style>
</head>
<body>
  <div class="d-flex min-vh-100">
    <aside class="app-sidebar offcanvas-lg offcanvas-start bg-white border-end" tabindex="-1" id="sidebar" aria-label="Portfolio navigation">
      <div class="offcanvas-header border-bottom">
        <a class="navbar-brand fw-bold" href="#" id="brand-link">Mohit Kumar Pandey</a>
        <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close navigation"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-3">
        <p class="text-uppercase text-secondary small fw-semibold mb-2">Explore</p>
        <nav id="tree-navigation" class="nav nav-pills flex-column gap-1" aria-label="Portfolio sections"></nav>
        <div class="mt-auto pt-4 border-top">
          <p class="small text-secondary mb-0" id="sidebar-tagline">Building ideas through code, research, and continuous learning.</p>
        </div>
      </div>
    </aside>

    <div class="content-column flex-grow-1">
      <header class="navbar bg-white border-bottom sticky-top">
        <div class="container-fluid px-3 px-lg-5">
          <button class="btn btn-outline-secondary d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <span class="navbar-text text-secondary" id="breadcrumb-label">Portfolio</span>
        </div>
      </header>

      <main class="container-fluid px-3 px-lg-5 py-4 py-lg-5">
        <article class="content-card" id="main-content" tabindex="-1" aria-live="polite"></article>
      </main>
      <footer class="visitor-footer border-top py-3 px-3 px-lg-5 d-none" aria-label="Visitor summary">
        <div class="d-flex flex-wrap justify-content-center gap-3" id="visitor-table-body"></div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
